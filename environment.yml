name: xcube-multistore
channels:
  - conda-forge
dependencies:
  # Python
  - python >=3.10
  # Required
  - dask
  - fsspec
  - numpy
  - panel
  - pyproj
  - pystac_client
  - tabulate
  - xarray
  - xcube >=1.13.1
  - xcube-resampling >=0.3.2
  - yaml
  # Development Dependencies - Tools
  - black
  - isort
  - mkdocs >=1.5
  - mkdocs-autorefs >=1.0
  - mkdocs-material >=9.4
  - mkdocs-jupyter
  - mkdocstrings >=0.24
  - mkdocstrings-python >=1.7
  - pytest
  - pytest-cov
  - ruff
  # Development Dependencies - Testing
  - xcube-zenodo >=1.2.0
  - xcube-clms >=1.3.1
  # Development Dependencies - Demos
  - jupyterlab
  - matplotlib
