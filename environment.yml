name: xcube-multistore
channels:
  - conda-forge
dependencies:
  # Python
  - python >=3.10
  # Required
  - dask
  - fsspec
  - numpy
  - panel
  - pyproj
  - tabulate
  - xarray
  - xcube >=1.9.0
  - xcube-resampling >=0.2.4
  - yaml
  # data store plugins
  - xcube-cci >=0.12.1
  - xcube-cds >=1.2.0
  - xcube-clms >=0.2.2
  - xcube-stac >=1.1.2
  - xcube-zenodo >=1.1.0
  # Development Dependencies - Tools
  - black
  - isort
  - mkdocs
  - mkdocs-autorefs
  - mkdocs-material
  - mkdocs-jupyter
  - mkdocstrings
  - mkdocstrings-python
  - pytest
  - pytest-cov
  - ruff
  # Development Dependencies - Demos
  - jupyterlab
  - matplotlib