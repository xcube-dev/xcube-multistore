name: xcube-multistore
channels:
  - conda-forge
dependencies:
  # Python
  - python >=3.10
  # Required
  - dask
  - fsspec
  - numpy
  - pyproj
  - tabulate
  - xarray
  - xcube >=1.9.0
  - xcube-cci >=0.11.2
  - xcube-cds >=1.0.0
  - xcube-clms >=0.2.2
  - xcube-stac >=0.2.0
  - xcube-zenodo >=1.0.0
  - yaml
  # Development Dependencies - Tools
  - black
  - isort
  - mkdocs
  - mkdocs-autorefs
  - mkdocs-material
  - mkdocs-jupyter
  - mkdocstrings
  - mkdocstrings-python
  - pytest
  - pytest-cov
  - ruff
  # Development Dependencies - Demos
  - jupyterlab
  - matplotlib