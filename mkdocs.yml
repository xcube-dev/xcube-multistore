site_name: xcube Multi-Source Data Store
repo_url: https://github.com/xcube-dev/xcube-multistore
repo_name: xcube-dev/xcube-multistore

copyright: Copyright &copy; 2025 Brockmann Consult

nav:
  - Overview: index.md
  - Getting Started: start.md
  - Configuration Guide: config.md
  - Examples:
      - Example 1:
        - Notebook page: examples/example1/scs1_xcube_multistore.ipynb
        - Configuration File: examples/example1/scs1_config.yml
        - Location of sites: examples/example1/scs1_sites.csv
      - Example 2:
        - Notebook page: examples/example2/scs2_xcube_multistore.ipynb
        - Configuration File: examples/example2/scs2_config.yml
        - Auxiliary Python functions: examples/example2/scs2_modify_dataset.py
      - Example 3:
        - Notebook page: examples/example3/scs3_xcube_multistore.ipynb
        - Configuration File: examples/example3/scs3_config.yml
        - Sites Locations: examples/example3/scs3_sites.csv
      - Example 4:
        - Notebook page: examples/example4/scs4_xcube_multistore.ipynb
        - Configuration File: examples/example4/scs4_config.yml
        - Auxiliary Python functions: examples/example4/scs4_modify_dataset.py
  - API Reference: api.md
  - About: about.md

theme:
  name: material
  logo: assets/eo-lincs.png
  # favicon: assets/logo-small.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xcube-dev/xcube-multistore
#    - icon: fontawesome/brands/python
#      link: https://pypi.org/project/xarray-eopf/

extra_css:
  - stylesheets/xarray_dataset.css

plugins:
  - search
  - mkdocs-jupyter
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_toc_entry: true
            show_root_heading: true
            show_source: true
            heading_level: 2
            annotations_path: brief
            members_order: source
